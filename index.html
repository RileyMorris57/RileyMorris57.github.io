<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Project</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --accent-hover: #79c0ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            color: #ffffff;
            margin-top: 0;
            font-size: 2rem;
        }

        p {
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #8b949e;
        }

        a.link {
            color: var(--accent-color);
            text-decoration: none;
        }

        a.link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello, World! 👋</h1>
        <p>Welcome to my GitHub repository. This page is hosted using GitHub Pages!</p>
        <p>I'm currently working on building cool projects and learning modern web development techniques.</p>
        
        <a href="https://github.com" class="btn" target="_blank">View on GitHub</a>

        <footer>
            <p>Created with HTML & CSS • <a href="https://github.com" class="link" target="_blank">My Profile</a></p>
        </footer>
    </div>

</body>
</html>
